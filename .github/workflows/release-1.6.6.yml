name: Build and publish IdleCast 1.6.6

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-1.6.6.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: idlecast-release-1.6.6
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install FFmpeg and yt-dlp
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          choco install yt-dlp -y --no-progress
          $ffmpeg = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg\tools" -Recurse -Filter ffmpeg.exe | Sort-Object Length -Descending | Select-Object -First 1 -ExpandProperty FullName
          $ffprobe = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg\tools" -Recurse -Filter ffprobe.exe | Sort-Object Length -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $ffmpeg -or -not $ffprobe) { throw "The standalone FFmpeg executables were not installed" }
          & $ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw "The selected FFmpeg executable failed its version check" }
          & $ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw "The selected FFprobe executable failed its version check" }
          $ytdlp = Get-ChildItem "$env:ChocolateyInstall\lib\yt-dlp\tools" -Recurse -Filter yt-dlp.exe | Sort-Object Length -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $ytdlp) { throw "The standalone yt-dlp executable was not installed" }
          & $ytdlp --version
          if ($LASTEXITCODE -ne 0) { throw "The selected yt-dlp executable failed its version check" }
          "FFMPEG_PATH=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFPROBE_PATH=$ffprobe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "YTDLP_PATH=$ytdlp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IDLECAST_RELEASE_DIR=$env:GITHUB_WORKSPACE\release" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer and portable application
        run: pnpm desktop:dist

      - name: Verify release files
        shell: pwsh
        run: |
          $files = @(
            "release/IdleCast-Setup-1.6.6-x64.exe",
            "release/IdleCast-Setup-1.6.6-x64.exe.blockmap",
            "release/IdleCast-Portable-1.6.6-x64.exe",
            "release/latest.yml"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file -PathType Leaf)) {
              throw "Required release file was not produced: $file"
            }
          }
          $bundledTools = @(
            @{ Path = "release/win-unpacked/resources/tools/yt-dlp.exe"; Args = @("--version") },
            @{ Path = "release/win-unpacked/resources/tools/ffmpeg.exe"; Args = @("-version") },
            @{ Path = "release/win-unpacked/resources/tools/ffprobe.exe"; Args = @("-version") }
          )
          foreach ($tool in $bundledTools) {
            if (-not (Test-Path $tool.Path -PathType Leaf)) { throw "Bundled media executable is missing: $($tool.Path)" }
            & $tool.Path @($tool.Args)
            if ($LASTEXITCODE -ne 0) { throw "Bundled media executable failed its version check: $($tool.Path)" }
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(
            "release/IdleCast-Setup-1.6.6-x64.exe",
            "release/IdleCast-Setup-1.6.6-x64.exe.blockmap",
            "release/IdleCast-Portable-1.6.6-x64.exe",
            "release/latest.yml"
          )
          $notes = @"
          IdleCast 1.6.6 prioritizes the actual next eligible video in the rolling buffer and hardens transition standby output.

          Standby title and progress updates are atomic, and a plain continuity encoder automatically takes over if the decorated overlay cannot load.
          "@
          if (gh release view v1.6.6 --repo ${{ github.repository }} 2>$null) {
            gh release upload v1.6.6 @files --clobber --repo ${{ github.repository }}
            gh release edit v1.6.6 --title "IdleCast 1.6.6" --notes "$notes" --latest --repo ${{ github.repository }}
          } else {
            gh release create v1.6.6 @files --target ${{ github.sha }} --title "IdleCast 1.6.6" --notes "$notes" --latest --repo ${{ github.repository }}
          }
